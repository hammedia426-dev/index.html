name: Publish Paladin 0.2.8 beta.5 install-verified Windows release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-paladin-0.2.8-beta5.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download install-verified beta.5 artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            'https://sdmntprwestus3.oaiusercontent.com/files/00000000-071c-81fd-aed9-a5bb94544e03/raw?se=2026-08-21T19%3A53%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=07e9bce8-a21b-5ab0-b6dd-84b980625711&skoid=b9a47e8b-72a2-4ed3-8028-a2a98c1a6142&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-21T13%3A52%3A07Z&ske=2026-08-22T13%3A52%3A07Z&sks=b&skv=2026-02-06&sig=EjFvJPWtrzT%2BwDbl51vITOBHiLKZoMJ3q4HtRq8fBME%3D' \
            -o artifact.zip
          unzip -o artifact.zip
          test -f paladin-windows-0.2.8-beta.5-setup.exe
          test -f paladin-windows-0.2.8-beta.5.msi
          test -f paladin-windows-0.2.8-beta.5-manifest.json
          test "$(sha256sum paladin-windows-0.2.8-beta.5-setup.exe | awk '{print $1}')" = '8d30b92f72188bd078a494eec72486ebb0fb79564875fa4a2e37d11abe429b23'
          test "$(stat -c%s paladin-windows-0.2.8-beta.5-setup.exe)" = '100295839'
          test "$(sha256sum paladin-windows-0.2.8-beta.5.msi | awk '{print $1}')" = 'ef8bea164f7a1d9845211d4fe683ab5deb9ebaa198101e4917e50a7467f12fdb'
          test "$(stat -c%s paladin-windows-0.2.8-beta.5.msi)" = '119406592'
          node - <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('paladin-windows-0.2.8-beta.5-manifest.json','utf8'));
          for (const key of ['upgradeFromBeta4Verified','installedAppsRegistrationVerified','installedExecutableLaunchVerified','msiInstallVerified','nsisCurrentUserInstallVerified','systemTray','wingedShieldTray','leafletSatelliteGeoMap','realtimeEndpointMarkers','animatedTrafficFlows','evidenceSnapshot','geminiAgent','agentMailServerIntegration']) {
            if (m[key] !== true) throw new Error(`${key} is not verified`);
          }
          if (m.version !== '0.2.8-beta.5' || m.nativeInstallerVersion !== '0.2.8-5') throw new Error('Wrong beta.5 version');
          if (m.packetPayloadCapture !== false) throw new Error('Packet payload capture must remain disabled');
          NODE

      - name: Create beta.5 public release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='paladin-0.2.8-beta.5'
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --prerelease --title 'Paladin AI Security 0.2.8 beta.5' --notes 'Clean Windows beta upgrade. Native installer version 0.2.8-5. Verified upgrade from beta.4, Installed Apps registration, launch/uninstall, winged-shield tray, Leaflet satellite Geo Tracker with real endpoint markers and animated flows, Gemini Agent visibility, AgentMail server integration, and packet-header metadata only.'
          fi
          gh release upload "$tag" paladin-windows-0.2.8-beta.5-setup.exe paladin-windows-0.2.8-beta.5.msi paladin-windows-0.2.8-beta.5-manifest.json --clobber

      - name: Verify public beta.5 assets round-trip
        shell: bash
        run: |
          set -euo pipefail
          base='https://github.com/hammedia426-dev/index.html/releases/download/paladin-0.2.8-beta.5'
          curl --fail --location --silent --show-error "$base/paladin-windows-0.2.8-beta.5-setup.exe" -o public-setup.exe
          curl --fail --location --silent --show-error "$base/paladin-windows-0.2.8-beta.5.msi" -o public.msi
          test "$(sha256sum public-setup.exe | awk '{print $1}')" = '8d30b92f72188bd078a494eec72486ebb0fb79564875fa4a2e37d11abe429b23'
          test "$(stat -c%s public-setup.exe)" = '100295839'
          test "$(sha256sum public.msi | awk '{print $1}')" = 'ef8bea164f7a1d9845211d4fe683ab5deb9ebaa198101e4917e50a7467f12fdb'
          test "$(stat -c%s public.msi)" = '119406592'

      - name: Write beta.5 public verification receipt
        shell: bash
        run: |
          cat > paladin-0.2.8-beta.5-public-release.json <<'JSON'
          {
            "product": "Paladin AI Security",
            "version": "0.2.8-beta.5",
            "nativeInstallerVersion": "0.2.8-5",
            "preferredInstaller": "nsis-current-user",
            "setupFilename": "paladin-windows-0.2.8-beta.5-setup.exe",
            "setupBytes": 100295839,
            "setupSha256": "8d30b92f72188bd078a494eec72486ebb0fb79564875fa4a2e37d11abe429b23",
            "msiFilename": "paladin-windows-0.2.8-beta.5.msi",
            "msiBytes": 119406592,
            "msiSha256": "ef8bea164f7a1d9845211d4fe683ab5deb9ebaa198101e4917e50a7467f12fdb",
            "mergedSourceCommit": "aa4d70639487aba8788cb29b7a4117c4fb9a54ac",
            "publicAssetVerified": true,
            "upgradeFromBeta4Verified": true,
            "installedAppsRegistrationVerified": true,
            "installedExecutableLaunchVerified": true,
            "msiInstallVerified": true,
            "nsisCurrentUserInstallVerified": true,
            "systemTray": true,
            "wingedShieldTray": true,
            "leafletSatelliteGeoMap": true,
            "realtimeEndpointMarkers": true,
            "animatedTrafficFlows": true,
            "evidenceSnapshot": true,
            "geminiAgent": true,
            "agentMailServerIntegration": true,
            "packetPayloadCapture": false
          }
          JSON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paladin-0.2.8-beta.5-public-release.json
          git commit -m 'Record verified Paladin 0.2.8 beta.5 public release'
          git push origin HEAD:main
