name: Publish Paladin 0.2.8 beta.2 MSI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-paladin-0.2.8-beta2.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download verified beta.2 artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            'https://sdmntprwestus.oaiusercontent.com/files/00000000-b24c-8230-90ad-6079a85363c5/raw?se=2026-08-21T08%3A02%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=296bb101-d744-580c-bad5-ec0e8fa8ff93&skoid=89c13f8f-c33a-46d8-9bf3-ad7158c7790a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-20T22%3A15%3A20Z&ske=2026-08-21T22%3A15%3A20Z&sks=b&skv=2026-02-06&sig=fpEwqjvEMgWjiuGb5lDC/wln%2BvYrB4kBMdyrn7WAr0Y%3D' \
            -o artifact.zip
          unzip -o artifact.zip
          test -f paladin-windows-0.2.8-beta.2.msi
          actual_hash="$(sha256sum paladin-windows-0.2.8-beta.2.msi | awk '{print $1}')"
          actual_size="$(stat -c%s paladin-windows-0.2.8-beta.2.msi)"
          test "$actual_hash" = 'cdf88bdd62d644dcdc7aea0c55649b0601c06523eb15782494aae1aafc06a096'
          test "$actual_size" = '119398400'

      - name: Create or update public beta.2 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='paladin-0.2.8-beta.2'
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title 'Paladin AI Security 0.2.8 beta.2' --notes 'Unsigned Windows beta refresh. Verified MSI with Malware/Defender, packet Geo Map, Connectors UI, tray/minimize and maintenance tooling.'
          fi
          gh release upload "$tag" paladin-windows-0.2.8-beta.2.msi --clobber

      - name: Verify public asset round-trip
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/hammedia426-dev/index.html/releases/download/paladin-0.2.8-beta.2/paladin-windows-0.2.8-beta.2.msi'
          curl --fail --location --silent --show-error "$url" -o public.msi
          test "$(sha256sum public.msi | awk '{print $1}')" = 'cdf88bdd62d644dcdc7aea0c55649b0601c06523eb15782494aae1aafc06a096'
          test "$(stat -c%s public.msi)" = '119398400'

      - name: Commit public verification receipt
        shell: bash
        run: |
          set -euo pipefail
          cat > paladin-0.2.8-beta.2-public-release.json <<'JSON'
          {
            "product": "Paladin AI Security",
            "version": "0.2.8-beta.2",
            "nativeInstallerVersion": "0.2.8-2",
            "filename": "paladin-windows-0.2.8-beta.2.msi",
            "bytes": 119398400,
            "sha256": "cdf88bdd62d644dcdc7aea0c55649b0601c06523eb15782494aae1aafc06a096",
            "sourceCommit": "3cb257db2bdb3678fbbcce2396994258204dae8a",
            "publicAssetVerified": true,
            "systemTray": true,
            "trayMinimize": true,
            "malwareAntivirus": true,
            "packetGeoMap": true,
            "connectorsUi": true,
            "maintenanceTools": true,
            "remoteAccessInventory": true,
            "geminiAgent": true
          }
          JSON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paladin-0.2.8-beta.2-public-release.json
          git commit -m 'Verify public Paladin 0.2.8 beta.2 release'
          git push origin HEAD:main
