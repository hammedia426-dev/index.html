name: Verify Paladin 0.2.8 public beta asset

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-paladin-0.2.8-beta.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: paladin-0.2.8-beta
      EXPECTED_SHA256: 6e3670caa0cb8f49ae0c9198c0dbb3085f30022354ec36a4e5be333ec7ebf150
      EXPECTED_BYTES: '119398400'
      ASSET: paladin-windows-0.2.8-beta.msi

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download MSI from public GitHub Release
        run: |
          set -euo pipefail
          url="https://github.com/hammedia426-dev/index.html/releases/download/$TAG/$ASSET"
          for attempt in $(seq 1 30); do
            if curl --fail --location --retry 2 "$url" -o "$ASSET"; then
              exit 0
            fi
            echo "Public release not ready yet; retry $attempt/30"
            sleep 10
          done
          exit 1

      - name: Verify exact public bytes and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(sha256sum "$ASSET" | awk '{print $1}')"
          actual_bytes="$(stat -c%s "$ASSET")"
          echo "Public MSI: $actual_bytes bytes; SHA-256 $actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA256"
          test "$actual_bytes" = "$EXPECTED_BYTES"

      - name: Publish verification marker
        shell: bash
        run: |
          set -euo pipefail
          cat > paladin-0.2.8-public-release.json <<EOF
          {
            "version": "0.2.8-beta",
            "channel": "UNSIGNED BETA",
            "testingOnly": true,
            "assetUrl": "https://github.com/hammedia426-dev/index.html/releases/download/paladin-0.2.8-beta/paladin-windows-0.2.8-beta.msi",
            "bytes": 119398400,
            "sha256": "6e3670caa0cb8f49ae0c9198c0dbb3085f30022354ec36a4e5be333ec7ebf150",
            "sourceCommit": "e9130ccf92fe73e281fb4228d8c506caa955b01c",
            "responsivenessSmokeTest": "passed",
            "responsivenessSampleMs": 500,
            "maxConsecutiveUnresponsiveSamples": 0,
            "publicAssetVerified": true,
            "verifiedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paladin-0.2.8-public-release.json
          git commit -m 'Verify public Paladin 0.2.8 beta MSI' || exit 0
          git push origin HEAD:main
