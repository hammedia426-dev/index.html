name: Publish Paladin Build 606 install-verified Windows release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-paladin-0.2.8-beta4.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download install-verified Build 606 artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            'https://sdmntprwestus.oaiusercontent.com/files/00000000-5644-8230-b3ba-2550cbd34d28/raw?se=2026-08-21T18%3A51%3A16Z&sp=r&sv=2026-02-06&sr=b&scid=add0c3b0-c730-5bdb-8704-cac505f7f7ca&skoid=89c13f8f-c33a-46d8-9bf3-ad7158c7790a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-20T22%3A13%3A31Z&ske=2026-08-21T22%3A13%3A31Z&sks=b&skv=2026-02-06&sig=10LOLKCWPW7jkyCLhcxwO9BKRntdTHSeHrSuCYEb%2B9M%3D' \
            -o artifact.zip
          unzip -o artifact.zip
          test -f paladin-windows-0.2.8-beta.4-setup.exe
          test -f paladin-windows-0.2.8-beta.4.msi
          test "$(sha256sum paladin-windows-0.2.8-beta.4-setup.exe | awk '{print $1}')" = '79300ce56148f09f8e5f5822ced4c96f7d2ee9ed8a257d11f471fa5a429568e1'
          test "$(stat -c%s paladin-windows-0.2.8-beta.4-setup.exe)" = '100418450'
          test "$(sha256sum paladin-windows-0.2.8-beta.4.msi | awk '{print $1}')" = '3e890052fea28de692c41012e640d4a592dcd44d0f10cd2808aa89670f7186c0'
          test "$(stat -c%s paladin-windows-0.2.8-beta.4.msi)" = '119406592'
          mv paladin-windows-0.2.8-beta.4-setup.exe paladin-windows-0.2.8-beta.4-build606-setup.exe
          mv paladin-windows-0.2.8-beta.4.msi paladin-windows-0.2.8-beta.4-build606.msi

      - name: Create or update Build 606 public release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='paladin-0.2.8-beta.4-build606'
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --prerelease --title 'Paladin AI Security 0.2.8 beta.4 Build 606' --notes 'Install-verified Windows Build 606. Includes corrected Geo Map wiring to the live Leaflet satellite tracker, real endpoint markers when geolocated packet data exists, curved network flows, evidence snapshot controls, visible Gemini Agent panel, and the gold winged-shield system tray icon.'
          fi
          gh release upload "$tag" paladin-windows-0.2.8-beta.4-build606-setup.exe paladin-windows-0.2.8-beta.4-build606.msi --clobber

      - name: Verify public Build 606 assets round-trip
        shell: bash
        run: |
          set -euo pipefail
          base='https://github.com/hammedia426-dev/index.html/releases/download/paladin-0.2.8-beta.4-build606'
          curl --fail --location --silent --show-error "$base/paladin-windows-0.2.8-beta.4-build606-setup.exe" -o public-setup.exe
          curl --fail --location --silent --show-error "$base/paladin-windows-0.2.8-beta.4-build606.msi" -o public.msi
          test "$(sha256sum public-setup.exe | awk '{print $1}')" = '79300ce56148f09f8e5f5822ced4c96f7d2ee9ed8a257d11f471fa5a429568e1'
          test "$(stat -c%s public-setup.exe)" = '100418450'
          test "$(sha256sum public.msi | awk '{print $1}')" = '3e890052fea28de692c41012e640d4a592dcd44d0f10cd2808aa89670f7186c0'
          test "$(stat -c%s public.msi)" = '119406592'

      - name: Write Build 606 public verification receipt
        shell: bash
        run: |
          cat > paladin-0.2.8-beta.4-build606-public-release.json <<'JSON'
          {
            "product": "Paladin AI Security",
            "version": "0.2.8-beta.4-build606",
            "nativeInstallerVersion": "0.2.8-4",
            "build": 606,
            "preferredInstaller": "nsis-current-user",
            "setupFilename": "paladin-windows-0.2.8-beta.4-build606-setup.exe",
            "setupBytes": 100418450,
            "setupSha256": "79300ce56148f09f8e5f5822ced4c96f7d2ee9ed8a257d11f471fa5a429568e1",
            "msiFilename": "paladin-windows-0.2.8-beta.4-build606.msi",
            "msiBytes": 119406592,
            "msiSha256": "3e890052fea28de692c41012e640d4a592dcd44d0f10cd2808aa89670f7186c0",
            "sourcePrHead": "8bc253db22c146055522b7725cece34d8ca53fcd",
            "mergedMainCommit": "add623ba8e10d1006dad21ba550ad8f19c052142",
            "publicAssetVerified": true,
            "installedAppsRegistrationVerified": true,
            "installedExecutableLaunchVerified": true,
            "msiInstallVerified": true,
            "nsisCurrentUserInstallVerified": true,
            "systemTray": true,
            "wingedShieldTrayIcon": true,
            "trayMinimize": true,
            "leafletSatelliteGeoMap": true,
            "realEndpointMarkers": true,
            "animatedTrafficFlows": true,
            "evidenceSnapshot": true,
            "packetPayloadCapture": false,
            "geminiAgentVisible": true
          }
          JSON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paladin-0.2.8-beta.4-build606-public-release.json
          git commit -m 'Record verified Paladin Build 606 public release'
          git push origin HEAD:main
